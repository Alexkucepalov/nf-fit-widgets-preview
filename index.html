<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nf-fit · widget preview</title>
  <style>
    @font-face {
      font-family: 'PressStart';
      src: url('./fonts/PressStart2P-Regular.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #1a1a1a;
      --wall: #2a2a2a;
      --ink: #0a0a0a;
      --paper: #f7f7f5;
      --muted: #8b929e;
      --muted-ink: #9a9a96;
      --red: #d71921;
      --soft-ink: #111111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: #eee;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(10px);
      background: rgba(26,26,26,.92);
      border-bottom: 1px solid #333;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #999;
    }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filters button {
      border: 1px solid #444;
      background: #222;
      color: #ddd;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .filters button.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      padding: 20px;
    }
    .card {
      background: var(--wall);
      border-radius: 18px;
      padding: 14px;
      border: 1px solid #333;
    }
    .card .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      align-items: baseline;
    }
    .card .name {
      font-size: 13px;
      font-weight: 600;
    }
    .card .name.new { color: #ff8a8a; }
    .card .fmt {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
    }
    .stage {
      background: #3a3a3a;
      border-radius: 14px;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .desc {
      margin-top: 10px;
      font-size: 11px;
      color: #888;
    }

    .pixel { font-family: 'PressStart', monospace; }
    .w {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      padding: 14px;
      border-radius: 28px;
      position: relative;
    }
    .w.sq { aspect-ratio: 1; max-width: 168px; }
    .w.wide { aspect-ratio: 2.2 / 1; max-width: 320px; }
    .w.strip { aspect-ratio: 4 / 1; max-width: 340px; padding: 10px 14px; border-radius: 22px; }
    .w.tall { aspect-ratio: 0.55; max-width: 110px; border-radius: 40px; padding: 16px 10px; }
    .w.disk {
      aspect-ratio: 1;
      max-width: 150px;
      border-radius: 999px;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .w.board { aspect-ratio: 1.35; max-width: 300px; }
    .w.light { background: var(--paper); color: var(--ink); border: 1px solid #e6e6e2; }
    .w.ink { background: var(--soft-ink); color: var(--paper); }
    .w.red { background: var(--red); color: #fff; }
    .lbl {
      font-family: 'PressStart', monospace;
      font-size: 8px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .w.ink .lbl, .w.red .lbl { color: var(--muted-ink); }
    .w.red .lbl { color: #ffd6d6; }
    .val {
      font-family: 'PressStart', monospace;
      font-size: 22px;
      margin-top: 8px;
      line-height: 1.2;
    }
    .val.lg { font-size: 28px; }
    .val.sm { font-size: 14px; }
    .unit { font-size: 10px; color: var(--muted); margin-left: 4px; }
    .led {
      width: 36px;
      height: 3px;
      background: var(--red);
      margin-top: 10px;
      border-radius: 1px;
    }
    .dots {
      margin-top: 8px;
      letter-spacing: 0.18em;
      font-size: 10px;
      color: var(--red);
      font-family: 'PressStart', monospace;
    }
    .sq-accent {
      width: 8px; height: 8px; background: var(--red); flex: 0 0 auto;
    }
    .row { display: flex; align-items: center; gap: 8px; }
    .row.spread { justify-content: space-between; width: 100%; }
    .grow { flex: 1; }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      flex: 1;
    }
    .metric .lbl { font-size: 7px; }
    .metric .val { font-size: 14px; margin-top: 4px; }
    .h-split { display: flex; gap: 12px; width: 100%; height: 100%; }
    .h-split > * { flex: 1; }
    .v-stack { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .divider-v { width: 2px; background: var(--red); align-self: stretch; flex: 0 0 2px; }
    .strip-inner { display: flex; align-items: center; gap: 10px; width: 100%; }
    .strip-inner .cell { flex: 1; }
    .pill-center { align-items: center; text-align: center; justify-content: space-between; height: 100%; }
    .pill-center .val { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0; }
    .clock .val { flex: 1; display: flex; align-items: center; justify-content: center; margin: 0; font-size: 20px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>nf-fit widget preview</h1>
      <p>Пиксельные макеты без телефона · sample data · фильтр NEW</p>
    </div>
    <div class="filters" id="filters">
      <button data-filter="new" class="active">только NEW ·</button>
      <button data-filter="all">все</button>
      <button data-filter="ink">ink / dark</button>
      <button data-filter="light">light</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>

  <script>
    const S = {
      dayLabel: '04.11',
      energyValue: '1870',
      energyHi: '18',
      energyLo: '70',
      stepsValue: '8432',
      stepsHi: '84',
      stepsLo: '32',
      waterValue: '1.2',
      waterUnit: 'L',
      sleepValue: '7.5',
      streakValue: '5',
      streakLeds: '■■■■■□□',
      energyDots: '●●●●●●··',
      waterDots: '●●●●●···',
    };

    const widgets = [
      // v1 (kept)
      { id: 'today', name: 'nf-fit · day', format: '4×2', theme: 'light', kind: 'board' },
      { id: 'kcal', name: 'nf-fit · kcal', format: '2×2', theme: 'light', kind: 'hero', label: 'KCAL', value: 'energyValue', accent: true },
      { id: 'steps', name: 'nf-fit · steps', format: '2×2', theme: 'light', kind: 'hero', label: 'STEPS', value: 'stepsValue' },
      { id: 'water', name: 'nf-fit · water', format: '2×2', theme: 'light', kind: 'hero', label: 'WATER', value: 'waterValue', unit: true },
      { id: 'sleep', name: 'nf-fit · sleep', format: '2×2', theme: 'light', kind: 'hero', label: 'SLEEP H', value: 'sleepValue' },
      { id: 'streak', name: 'nf-fit · streak', format: '2×2', theme: 'light', kind: 'hero', label: 'STREAK', value: 'streakValue', accent: true },
      { id: 'dual', name: 'nf-fit · dual', format: '2×2', theme: 'light', kind: 'dual' },
      { id: 'strip', name: 'nf-fit · strip', format: '4×1', theme: 'light', kind: 'strip' },
      { id: 'wide-kcal', name: 'nf-fit · wide kcal', format: '4×2', theme: 'light', kind: 'wide' },
      { id: 'ink-today', name: 'nf-fit · ink day', format: '4×2', theme: 'ink', kind: 'board' },
      { id: 'tall', name: 'nf-fit · tall', format: '2×3', theme: 'light', kind: 'tall' },
      // NEW batch 1–2
      { id: 'new-pixel-kcal', name: 'NEW · pixel kcal', format: '2×2', theme: 'light', kind: 'hero-led', label: 'KCAL', value: 'energyValue' },
      { id: 'new-pixel-kcal-ink', name: 'NEW · pixel kcal ink', format: '2×2', theme: 'ink', kind: 'hero-led', label: 'KCAL', value: 'energyValue' },
      { id: 'new-pixel-day', name: 'NEW · pixel day', format: '2×2', theme: 'light', kind: 'day' },
      { id: 'new-pixel-day-ink', name: 'NEW · pixel day ink', format: '2×2', theme: 'ink', kind: 'day' },
      { id: 'new-pixel-pill-kcal', name: 'NEW · pixel pill kcal', format: '2×3', theme: 'ink', kind: 'pill', label: 'KCAL', value: 'energyValue' },
      { id: 'new-pixel-pill-sleep', name: 'NEW · pixel pill sleep', format: '2×3', theme: 'ink', kind: 'pill', label: 'SLEEP', value: 'sleepValue' },
      { id: 'new-red-kcal', name: 'NEW · red kcal', format: '2×2', theme: 'red', kind: 'disk', label: 'KCAL', value: 'energyValue' },
      { id: 'new-led-board', name: 'NEW · led board', format: '4×2', theme: 'ink', kind: 'board-led' },
      { id: 'new-matrix-strip', name: 'NEW · matrix strip', format: '4×1', theme: 'ink', kind: 'strip' },
      { id: 'new-dual-ink', name: 'NEW · dual ink', format: '2×2', theme: 'ink', kind: 'dual-led' },
      { id: 'new-wide-ink-kcal', name: 'NEW · wide ink kcal', format: '4×2', theme: 'ink', kind: 'wide' },
      { id: 'new-pixel-water', name: 'NEW · pixel water', format: '2×2', theme: 'light', kind: 'hero-led', label: 'WATER', value: 'waterValue', unit: true },
      { id: 'new-pixel-streak-ink', name: 'NEW · pixel streak ink', format: '2×2', theme: 'ink', kind: 'hero-led', label: 'STREAK', value: 'streakValue' },
      // NEW batch 3
      { id: 'new-pixel-steps-ink', name: 'NEW · pixel steps ink', format: '2×2', theme: 'ink', kind: 'hero-led', label: 'STEPS', value: 'stepsValue' },
      { id: 'new-pixel-sleep-ink', name: 'NEW · pixel sleep ink', format: '2×2', theme: 'ink', kind: 'hero-led', label: 'SLEEP', value: 'sleepValue' },
      { id: 'new-light-pill-steps', name: 'NEW · light pill steps', format: '2×3', theme: 'light', kind: 'pill', label: 'STEPS', value: 'stepsValue' },
      { id: 'new-red-sleep', name: 'NEW · red sleep', format: '2×2', theme: 'red', kind: 'disk', label: 'SLEEP', value: 'sleepValue' },
      { id: 'new-clock-kcal', name: 'NEW · clock kcal', format: '2×3', theme: 'ink', kind: 'clock' },
      { id: 'new-streak-leds', name: 'NEW · streak leds', format: '2×2', theme: 'ink', kind: 'streak-leds' },
      { id: 'new-bento', name: 'NEW · bento', format: '4×2', theme: 'ink', kind: 'bento' },
      { id: 'new-mono-strip-light', name: 'NEW · mono strip light', format: '4×1', theme: 'light', kind: 'strip' },
      { id: 'new-water-pill-ink', name: 'NEW · water pill ink', format: '2×3', theme: 'ink', kind: 'pill', label: 'WATER', value: 'waterValue' },
      // batch 4
      { id: 'new-clock-steps', name: 'NEW · clock steps', format: '2×3', theme: 'ink', kind: 'clock-steps' },
      { id: 'new-red-water', name: 'NEW · red water', format: '2×2', theme: 'red', kind: 'disk', label: 'H2O', value: 'waterValue' },
      { id: 'new-white-disk-steps', name: 'NEW · white disk steps', format: '2×2', theme: 'light', kind: 'disk-outline', label: 'STEPS', value: 'stepsValue' },
      { id: 'new-pair-kcal-sleep', name: 'NEW · pair kcal sleep', format: '4×2', theme: 'ink', kind: 'pair' },
      { id: 'new-stack-three', name: 'NEW · stack three', format: '2×3', theme: 'ink', kind: 'stack3' },
      { id: 'new-horizon-kcal', name: 'NEW · horizon kcal', format: '4×2', theme: 'light', kind: 'wide' },
      { id: 'new-frame-day', name: 'NEW · frame day', format: '2×2', theme: 'light', kind: 'frame-day' },
      { id: 'new-micro-kcal-ink', name: 'NEW · micro kcal ink', format: '2×2', theme: 'ink', kind: 'micro' },
      { id: 'new-quad-light', name: 'NEW · quad light', format: '4×2', theme: 'light', kind: 'quad' },
    ];

    function sizeClass(format) {
      if (format === '4×1') return 'strip';
      if (format === '2×3') return 'tall';
      if (format.startsWith('4')) return 'wide';
      return 'sq';
    }

    function renderWidget(w) {
      const theme = w.theme === 'ink' ? 'ink' : w.theme === 'red' ? 'red' : 'light';
      const base = `w ${theme} ${sizeClass(w.format)}`;
      const v = (k) => S[k] ?? '—';

      if (w.kind === 'hero' || w.kind === 'hero-led') {
        return `<div class="${base}">
          <div class="row spread"><span class="lbl">${w.label}</span>${w.accent || w.kind==='hero-led' ? '<span class="sq-accent"></span>' : ''}</div>
          <div class="val ${w.value==='energyValue'||w.value==='streakValue'?'lg':''}">${v(w.value)}${w.unit?`<span class="unit">${S.waterUnit}</span>`:''}</div>
          ${w.kind==='hero-led'?'<div class="led"></div>':''}
          ${w.value==='energyValue'||w.value==='waterValue'?`<div class="dots" style="color:${theme==='ink'?'var(--red)':'var(--ink)'}">${w.value==='energyValue'?S.energyDots:S.waterDots}</div>`:''}
        </div>`;
      }
      if (w.kind === 'day') {
        return `<div class="${base}" style="align-items:center;justify-content:center;text-align:center">
          <div class="lbl">DAY</div>
          <div class="val lg" style="margin-top:10px">${S.dayLabel}</div>
          <span class="sq-accent" style="margin-top:12px"></span>
        </div>`;
      }
      if (w.kind === 'pill') {
        return `<div class="${base} pill-center">
          <div class="lbl">${w.label}</div>
          <div class="val">${v(w.value)}</div>
          <span class="sq-accent"></span>
        </div>`;
      }
      if (w.kind === 'disk') {
        return `<div class="${base} disk">
          <div class="lbl">${w.label}</div>
          <div class="val" style="margin-top:8px;font-size:18px">${v(w.value)}</div>
        </div>`;
      }
      if (w.kind === 'clock') {
        return `<div class="${base} tall ink pill-center clock">
          <div class="lbl">KCAL</div>
          <div class="val">${S.energyHi}</div>
          <div class="val">${S.energyLo}</div>
          <span class="sq-accent"></span>
        </div>`;
      }
      if (w.kind === 'clock-steps') {
        return `<div class="${base} tall ink pill-center clock">
          <div class="lbl">STEPS</div>
          <div class="val" style="font-size:16px">${S.stepsHi}</div>
          <div class="val" style="font-size:16px">${S.stepsLo}</div>
          <span class="sq-accent"></span>
        </div>`;
      }
      if (w.kind === 'disk-outline') {
        return `<div class="${base} disk" style="border:2px solid #0a0a0a;background:#f7f7f5;color:#0a0a0a">
          <div class="lbl">${w.label}</div>
          <div class="val" style="margin-top:8px;font-size:16px;color:#0a0a0a">${v(w.value)}</div>
        </div>`;
      }
      if (w.kind === 'pair') {
        return `<div class="${base} wide">
          <div class="h-split">
            <div class="v-stack" style="align-items:center;text-align:center">
              <div class="lbl">KCAL</div>
              <div class="val" style="font-size:20px">${S.energyValue}</div>
              <div class="led"></div>
            </div>
            <div class="divider-v"></div>
            <div class="v-stack" style="align-items:center;text-align:center">
              <div class="lbl">SLEEP</div>
              <div class="val" style="font-size:20px">${S.sleepValue}</div>
              <span class="sq-accent" style="margin-top:10px"></span>
            </div>
          </div>
        </div>`;
      }
      if (w.kind === 'stack3') {
        return `<div class="${base}" style="max-width:140px;border-radius:28px;justify-content:flex-start">
          <div class="lbl">KCAL</div><div class="val sm">${S.energyValue}</div>
          <div class="led" style="width:100%;margin:8px 0"></div>
          <div class="lbl">STEPS</div><div class="val sm">${S.stepsValue}</div>
          <div class="led" style="width:100%;margin:8px 0"></div>
          <div class="lbl">SLEEP</div><div class="val sm">${S.sleepValue}</div>
        </div>`;
      }
      if (w.kind === 'frame-day') {
        return `<div class="${base}" style="border:3px solid #0a0a0a;align-items:center;justify-content:center;text-align:center">
          <div class="val" style="font-size:18px;margin:0">${S.dayLabel}</div>
          <span class="sq-accent" style="margin-top:10px"></span>
          <div class="lbl" style="margin-top:10px">KCAL</div>
          <div class="val sm">${S.energyValue}</div>
        </div>`;
      }
      if (w.kind === 'micro') {
        return `<div class="${base}" style="align-items:center;justify-content:center;text-align:center">
          <div class="lbl">KCAL</div>
          <div class="val" style="font-size:30px;margin-top:8px">${S.energyValue}</div>
        </div>`;
      }
      if (w.kind === 'quad') {
        return `<div class="${base} board">
          <div class="metrics" style="flex:1;height:100%">
            <div class="metric" style="align-items:center;text-align:center;justify-content:center;display:flex;flex-direction:column"><div class="lbl">KCAL</div><div class="val sm">${S.energyValue}</div></div>
            <div class="metric" style="align-items:center;text-align:center;justify-content:center;display:flex;flex-direction:column;border-left:2px solid var(--red);padding-left:8px"><div class="lbl">STEPS</div><div class="val sm">${S.stepsValue}</div></div>
            <div class="metric" style="align-items:center;text-align:center;justify-content:center;display:flex;flex-direction:column;border-top:2px solid var(--red);padding-top:8px"><div class="lbl">H2O</div><div class="val sm">${S.waterValue}</div></div>
            <div class="metric" style="align-items:center;text-align:center;justify-content:center;display:flex;flex-direction:column;border-top:2px solid var(--red);border-left:2px solid var(--red);padding-top:8px;padding-left:8px"><div class="lbl">SLEEP</div><div class="val sm">${S.sleepValue}</div></div>
          </div>
        </div>`;
      }
      if (w.kind === 'streak-leds') {
        return `<div class="${base}">
          <div class="row spread"><span class="lbl">STREAK</span><span class="sq-accent"></span></div>
          <div class="val lg">${S.streakValue}</div>
          <div class="dots">${S.streakLeds}</div>
        </div>`;
      }
      if (w.kind === 'board' || w.kind === 'board-led') {
        const led = w.kind === 'board-led';
        return `<div class="${base} board">
          <div class="row spread"><span class="pixel" style="font-size:11px">${S.dayLabel}</span><span class="sq-accent"></span></div>
          <div class="metrics">
            <div class="metric"><div class="lbl">KCAL</div><div class="val">${S.energyValue}</div>${led?`<div class="dots">${S.energyDots}</div>`:''}</div>
            <div class="metric"><div class="lbl">STEPS</div><div class="val">${S.stepsValue}</div></div>
            <div class="metric"><div class="lbl">WATER</div><div class="val">${S.waterValue}<span class="unit">${S.waterUnit}</span></div>${led?`<div class="dots">${S.waterDots}</div>`:''}</div>
            <div class="metric"><div class="lbl">SLEEP</div><div class="val">${S.sleepValue}</div></div>
          </div>
        </div>`;
      }
      if (w.kind === 'strip') {
        return `<div class="${base} strip">
          <div class="strip-inner">
            <div class="pixel" style="font-size:11px">${S.dayLabel}</div>
            <span class="sq-accent"></span>
            <div class="cell"><div class="lbl">KCAL</div><div class="val sm">${S.energyValue}</div></div>
            <div class="cell"><div class="lbl">STEPS</div><div class="val sm">${S.stepsValue}</div></div>
            <div class="cell"><div class="lbl">H2O</div><div class="val sm">${S.waterValue}<span class="unit">${S.waterUnit}</span></div></div>
          </div>
        </div>`;
      }
      if (w.kind === 'wide') {
        return `<div class="${base} wide">
          <div class="row spread"><span class="lbl">ENERGY</span><div class="row"><span class="pixel" style="font-size:10px">${S.dayLabel}</span><span class="sq-accent"></span></div></div>
          <div class="val lg" style="font-size:32px;margin-top:10px">${S.energyValue}</div>
          <div class="dots">${S.energyDots}</div>
        </div>`;
      }
      if (w.kind === 'dual' || w.kind === 'dual-led') {
        return `<div class="${base}">
          <div class="lbl">KCAL</div>
          <div class="val" style="font-size:20px">${S.energyValue}</div>
          <div class="dots">${S.energyDots}</div>
          ${w.kind==='dual-led'?'<div class="led" style="width:100%;margin:10px 0"></div>':'<hr style="border:none;border-top:1px solid #e6e6e2;margin:10px 0">'}
          <div class="lbl">WATER</div>
          <div class="val" style="font-size:20px">${S.waterValue}<span class="unit">${S.waterUnit}</span></div>
          <div class="dots">${S.waterDots}</div>
        </div>`;
      }
      if (w.kind === 'tall') {
        return `<div class="${base}" style="max-width:140px;border-radius:28px">
          <div class="lbl">STEPS</div>
          <div class="val" style="flex:1;display:flex;align-items:center">${S.stepsValue}</div>
          <hr style="border:none;border-top:1px solid #e6e6e2;width:100%">
          <div class="lbl" style="margin-top:8px">SLEEP H</div>
          <div class="val sm">${S.sleepValue}</div>
        </div>`;
      }
      if (w.kind === 'bento') {
        return `<div class="${base} wide">
          <div class="h-split">
            <div class="v-stack">
              <div class="row spread"><span class="lbl">${S.dayLabel}</span><span class="sq-accent"></span></div>
              <div class="lbl">KCAL</div>
              <div class="val lg">${S.energyValue}</div>
              <div class="dots">${S.energyDots}</div>
            </div>
            <div class="divider-v"></div>
            <div class="v-stack">
              <div><div class="lbl">STEPS</div><div class="val sm">${S.stepsValue}</div></div>
              <div><div class="lbl">H2O</div><div class="val sm">${S.waterValue}<span class="unit">${S.waterUnit}</span></div></div>
              <div><div class="lbl">SLEEP</div><div class="val sm">${S.sleepValue}</div></div>
            </div>
          </div>
        </div>`;
      }
      return `<div class="${base}"><div class="lbl">${w.name}</div></div>`;
    }

    let filter = 'new';
    const grid = document.getElementById('grid');

    function paint() {
      grid.innerHTML = '';
      widgets.filter((w) => {
        if (filter === 'new') return w.name.startsWith('NEW ·');
        if (filter === 'ink') return w.theme === 'ink' || w.theme === 'red';
        if (filter === 'light') return w.theme === 'light';
        return true;
      }).forEach((w) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="meta">
            <div class="name ${w.name.startsWith('NEW') ? 'new' : ''}">${w.name}</div>
            <div class="fmt">${w.format}</div>
          </div>
          <div class="stage">${renderWidget(w)}</div>
          <div class="desc">${w.id}</div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('filters').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      filter = btn.dataset.filter;
      [...document.querySelectorAll('.filters button')].forEach((b) => b.classList.toggle('active', b === btn));
      paint();
    });

    paint();
  </script>
</body>
</html>
